<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<title>MT5 FLOW — Trading Terminal</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --bg-root: #020617;
  --bg-surface: #0E1223;
  --bg-elevated: #1A1E2F;
  --bg-hover: #232842;
  --border-default: #334155;
  --border-active: #475569;
  --text-primary: #F8FAFC;
  --text-secondary: #94A3B8;
  --text-tertiary: #64748B;
  --accent-blue: #4e8cff;
  --accent-green: #22C55E;
  --accent-red: #EF4444;
  --accent-amber: #f0a500;
  --accent-purple: #9b59b6;
  --accent-cyan: #00c8e8;
  --ring-blue: rgba(78,140,255,0.3);
  --ring-red: rgba(239,68,68,0.3);
}
* { box-sizing: border-box; margin: 0; }
body { font-family: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg-root); color: var(--text-primary); overflow-x: hidden; }
.mono { font-family: 'Fira Code', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-active); border-radius: 3px; }
::selection { background: var(--accent-blue); color: #fff; }
</style>
</head>
<body>
<div id="root"></div>
<script src="theme.js"></script>
<script src="chrome.js"></script>
<script src="terminal.js"></script>
<script src="palette.js"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
